services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: barberbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: barberbooking_local_dev
    volumes:
      - barberbooking_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barberbooking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: BarberBooking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=barberbooking;Username=postgres;Password=barberbooking_local_dev
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: local-development-only-signing-key-never-use-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  barberbooking_postgres:
